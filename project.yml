name: CompassPro
options:
  bundleIdPrefix: com.compasspro
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

packages:
  AlertKit:
    url: https://github.com/sparrowcode/AlertKit
    exactVersion: 5.1.8

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  CompassPro:
    type: application
    platform: iOS
    sources:
      - path: ios-app
    dependencies:
      - package: AlertKit
      - framework: SideInstallerFFI.xcframework
        embed: false
      - target: SideInstallerLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.compasspro.app
        INFOPLIST_FILE: ios-app/Info.plist
        OTHER_LDFLAGS: "-lc++"
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - CompassProTests

  CompassProTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios-tests
    dependencies:
      - target: CompassPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.compasspro.app.tests
        GENERATE_INFOPLIST_FILE: YES

  SideInstallerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: ios-live-activity
      - path: ios-app/PairingActivityAttributes.swift
      - path: ios-app/InstallActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.compasspro.app.LiveActivity
        INFOPLIST_FILE: ios-live-activity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
